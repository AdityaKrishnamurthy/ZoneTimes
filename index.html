<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZoneTimes – Live World Clock & Timezone Converter</title>
  <meta name="description"
    content="ZoneTimes is a responsive web app showing live clocks for world time zones and a built-in timezone converter.">
  <meta name="author" content="AdityaKrishnamurthy">
  <meta name="keywords"
    content="world clock, time zones, timezone converter, UTC, IST, PST, responsive clock, JavaScript">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="ZoneTimes – Live World Clock & Timezone Converter" />
  <meta property="og:description"
    content="Track world time zones in real time and convert between any two timezones." />
  <meta property="og:image" content="https://adityakrishnamurthy.github.io/ZoneTimes/media/favicon.png" />
  <meta property="og:url" content="https://adityakrishnamurthy.github.io/ZoneTimes/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="media/favicon.png" sizes="512x512">
  <link rel="icon" type="image/png" sizes="32x32" href="media/favicon.png">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1 class="logo-title">
      <a href="." id="logoLink" class="logo-link" title="Reload ZoneTimes">
        <img src="media/favicon.png" alt="ZoneTime logo" class="logo-icon" />
        ZoneTimes
      </a>
    </h1>
    <div class="header-actions">
      <button id="infoBtn" type="button" title="Timezone & Abbreviation Guide" aria-label="Timezone Guide">ℹ️</button>
      <div class="theme-switcher-wrap">
        <button id="themeSwitcherBtn" type="button" title="Choose theme" aria-label="Choose theme" aria-expanded="false">🎨</button>
        <div id="themeSwitcherPanel" class="theme-switcher-panel hidden"></div>
      </div>
      <button id="toggleTheme" title="Toggle light/dark">🌙</button>
    </div>
  </header>

  <div class="controls">
    <div class="search-wrapper">
      <input type="text" id="searchInput" placeholder="Search city or timezone..." autocomplete="off" />
      <div id="searchResults" class="search-results hidden"></div>
    </div>
    <button id="toggleConverter" class="converter-toggle" type="button" aria-expanded="false" aria-controls="converterPanel">
      <span class="conv-icon">⏱</span> Time Converter
    </button>
  </div>

  <section id="converterPanel" class="converter-panel collapsed">
    <div class="converter-inner">
      <div class="converter-grid">
        <div class="converter-field">
          <label for="fromTzInput">From</label>
          <div class="tz-search-wrapper">
            <input type="text" id="fromTzInput" placeholder="Search timezone..." autocomplete="off" />
            <div id="fromResults" class="tz-results hidden"></div>
          </div>
        </div>
        <button id="swapTz" class="swap-btn" title="Swap timezones">⇄</button>
        <div class="converter-field">
          <label for="toTzInput">To</label>
          <div class="tz-search-wrapper">
            <input type="text" id="toTzInput" placeholder="Search timezone..." autocomplete="off" />
            <div id="toResults" class="tz-results hidden"></div>
          </div>
        </div>
        <div class="converter-field">
          <label for="convDate">Date (DD-MM-YYYY)</label>
          <div class="date-picker-wrap">
            <input type="text" id="convDate" placeholder="DD-MM-YYYY" inputmode="numeric" maxlength="10" autocomplete="off" />
            <button type="button" id="datePickerBtn" class="date-picker-btn" title="Open calendar" aria-label="Open calendar">📅</button>
            <div id="datePicker" class="date-picker hidden" role="dialog" aria-label="Choose date"></div>
          </div>
        </div>
        <div class="converter-field">
          <label for="convTime">Time</label>
          <div class="time-picker-wrap">
            <input type="text" id="convTime" placeholder="08:00" inputmode="numeric" autocomplete="off" />
            <select id="convAmpm" class="ampm-select" aria-label="Select AM or PM">
              <option value="AM">AM</option>
              <option value="PM" selected>PM</option>
            </select>
          </div>
        </div>
        <div class="converter-field converter-actions">
          <button id="useNow" class="btn-outline">Now</button>
          <button id="doConvert" class="btn-primary">Convert</button>
        </div>
      </div>
      <div id="convResult" class="conv-result hidden"></div>
    </div>
  </section>

  <main>
    <h2 class="visually-hidden">Live world clocks</h2>
    <div class="clocks" id="clockContainer"></div>
  </main>

  <footer class="footer">
    <div class="footer-credit">
      Created by <a href="https://github.com/AdityaKrishnamurthy/" target="_blank" rel="noopener">AdityaKrishnamurthy</a>
    </div>
  </footer>

  <div id="infoModalOverlay" class="modal-overlay hidden">
    <div id="infoModal" class="info-modal" role="dialog" aria-labelledby="infoModalTitle">
      <div class="info-modal-header">
        <h3 id="infoModalTitle">ℹ️ Timezone & Abbreviation Guide</h3>
        <button type="button" id="closeInfoModal" class="close-modal-btn" aria-label="Close guide">&times;</button>
      </div>
      <div class="info-modal-search">
        <input type="text" id="infoSearchInput" placeholder="Search abbreviation (IST, PST), country, or city..." autocomplete="off" />
      </div>
      <div class="info-modal-body" id="infoModalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
